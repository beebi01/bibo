<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片儲存器</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .grid-item {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 8px;
    }
    .grid-item img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body class="bg-gray-100 py-10">
  <div class="container mx-auto px-4">
    <h1 class="text-2xl font-semibold mb-6 text-center">我的照片儲存器</h1>

    <!-- 30格的照片顯示區域 -->
    <div class="grid grid-cols-3 gap-6">
      <!-- 每個格子的內容 -->
      <div class="grid-item">
        <p class="font-medium">標題1</p>
        <img src="https://via.placeholder.com/150" alt="Photo 1">
      </div>
      <div class="grid-item">
        <p class="font-medium">標題2</p>
        <img src="https://via.placeholder.com/150" alt="Photo 2">
      </div>
      <div class="grid-item">
        <p class="font-medium">標題3</p>
        <img src="https://via.placeholder.com/150" alt="Photo 3">
      </div>
      <!-- 可以繼續增加格子，這裡展示3個 -->
    </div>
  </div>
</body>
</html>
