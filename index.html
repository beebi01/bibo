                </div>
                
                <div className="grid grid-cols-2 gap-8 w-full max-w-sm mb-4">
                   <div className="text-center p-4 bg-slate-50 rounded-2xl">
                      <span className="text-xs text-slate-400 uppercase font-bold tracking-wider block mb-1">Time</span>
                      <div className="text-2xl font-bold text-slate-700">{formatTime(timeSpent)}</div>
                   </div>
                   <div className="text-center p-4 bg-slate-50 rounded-2xl">
                      <span className="text-xs text-slate-400 uppercase font-bold tracking-wider block mb-1">Accuracy</span>
                      <div className={`text-2xl font-bold ${gradeColor}`}>{percentage}%</div>
                   </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onClick={onRestart} className={`w-full py-4 ${theme.button} text-white font-bold rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all duration-200`}>再次挑戰</button>
                <button onClick={onHome} className="w-full py-4 bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition-colors">返回主選單</button>
              </div>
            </div>
          </div>

          {wrongList.length > 0 && (
            <div className="bg-white rounded-3xl shadow-lg overflow-hidden p-6 md:p-8 border border-slate-100">
              <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center">
                <span className="w-2 h-8 bg-rose-500 rounded-full mr-3"></span>
                錯題回顧 ({wrongList.length} 題)
              </h3>
              <div className="space-y-6">
                {wrongList.map((item, idx) => (
                  <div key={idx} className="bg-slate-50/50 rounded-2xl p-6 border border-slate-200/60">
                    <div className="flex items-center mb-3">
                       <span className="bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1 rounded-full mr-2">#{item.originalIndex + 1}</span>
                       {item.question.a.length > 1 && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">複選</span>}
                    </div>
                    <div className="text-slate-800 font-bold mb-5 leading-relaxed text-lg" dangerouslySetInnerHTML={{ __html: item.question.q }} />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base">
                      <div className="bg-rose-50 border border-rose-100 rounded-xl p-4">
                        <span className="block text-rose-600 font-bold mb-2 text-xs uppercase tracking-wider">您的選擇</span>
                        <ul className="space-y-1 text-rose-900">
                          {item.userSelected.length > 0 ? item.userSelected.map(selIdx => <li key={selIdx} className="flex items-start"><span className="font-mono mr-2">{String.fromCharCode(65 + selIdx)}.</span>{item.question.o[selIdx]}</li>) : <li className="italic text-rose-400">未作答</li>}
                        </ul>
                      </div>
                      <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
                        <span className="block text-emerald-600 font-bold mb-2 text-xs uppercase tracking-wider">正確答案</span>
                         <ul className="space-y-1 text-emerald-900">
                          {item.question.a.map(ansIdx => <li key={ansIdx} className="flex items-start"><span className="font-mono mr-2">{String.fromCharCode(65 + ansIdx)}.</span>{item.question.o[ansIdx]}</li>)}
                        </ul>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const QuizGame = ({ bank, onExit }) => {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedIndices, setSelectedIndices] = useState([]);
      const [wrongList, setWrongList] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isQuizEnded, setIsQuizEnded] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [timeSpent, setTimeSpent] = useState(0);
      const timerRef = useRef(null);
      const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;

      useEffect(() => { startQuiz(); return () => stopTimer(); }, [bank]);

      const startTimer = () => {
        stopTimer();
        timerRef.current = setInterval(() => setTimeSpent(prev => prev + 1), 1000);
      };

      const stopTimer = () => { if (timerRef.current) clearInterval(timerRef.current); };

      const startQuiz = useCallback(() => {
        setIsLoading(true);
        const shuffled = [...bank.questions].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, Math.min(bank.limit, shuffled.length));
        setQuestions(selected);
        setCurrentIndex(0);
        setScore(0);
        setWrongList([]);
        setSelectedIndices([]);
        setIsSubmitted(false);
        setIsQuizEnded(false);
        setTimeSpent(0);
        window.scrollTo(0, 0);
        setIsLoading(false);
        startTimer();
      }, [bank]);

      const currentQuestion = questions[currentIndex];
      
      if (isLoading || !currentQuestion) return <div className={`min-h-screen flex items-center justify-center bg-gradient-to-br ${theme.bgGradient}`}><div className={`animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 ${theme.text}`}></div></div>;

      const isMulti = currentQuestion.a.length > 1;
      const progress = ((currentIndex + 1) / questions.length) * 100;

      const handleOptionClick = (index) => {
        if (isSubmitted) return;
        if (isMulti) {
          if (selectedIndices.includes(index)) setSelectedIndices(selectedIndices.filter(i => i !== index));
          else setSelectedIndices([...selectedIndices, index]);
        } else {
          setSelectedIndices([index]);
        }
      };

      const handleSubmit = () => {
        if (selectedIndices.length === 0) { alert("請至少選擇一個答案！"); return; }
        setIsSubmitted(true);
        const sortedSelected = [...selectedIndices].sort((a, b) => a - b);
        const sortedCorrect = [...currentQuestion.a].sort((a, b) => a - b);
        const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
        if (isCorrect) setScore(prev => prev + 1);
        else setWrongList(prev => [...prev, { question: currentQuestion, userSelected: selectedIndices, originalIndex: currentIndex }]);
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedIndices([]);
          setIsSubmitted(false);
          window.scrollTo(0, 0);
        } else {
          stopTimer();
          setIsQuizEnded(true);
          window.scrollTo(0, 0);
        }
      };

      if (isQuizEnded) return <div className={`min-h-screen bg-gradient-to-br ${theme.bgGradient} flex justify-center py-8`}><ResultScreen score={score} total={questions.length} timeSpent={timeSpent} wrongList={wrongList} theme={theme} onRestart={startQuiz} onHome={onExit} /></div>;

      return (
        <div className={`min-h-screen bg-gradient-to-br ${theme.bgGradient} py-6 px-4 flex flex-col items-center animate-fade-in-up`}>
          <div className="w-full max-w-3xl flex flex-col md:flex-row justify-between items-end md:items-center mb-6 gap-4">
            <div className="flex flex-col items-start w-full md:w-auto">
              <button onClick={onExit} className={`text-slate-500 hover:${theme.text} text-sm font-bold flex items-center gap-1 transition-colors mb-2`}>← 退出測驗</button>
              <h1 className={`text-xl font-extrabold ${theme.textDark} tracking-tight`}>{bank.title}</h1>
            </div>
            <div className="flex items-center justify-between w-full md:w-auto gap-4">
               <div className={`flex items-center gap-2 px-4 py-2 bg-white rounded-full border ${theme.border} ${theme.textDark} font-mono font-bold shadow-sm`}>{formatTime(timeSpent)}</div>
               <div className="flex items-baseline gap-1 bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm">
                 <span className={`text-2xl font-bold ${theme.text} leading-none`}>{currentIndex + 1}</span>
                 <span className="text-sm text-slate-400 font-bold">/ {questions.length}</span>
               </div>
            </div>
          </div>

          <div className="bg-white w-full max-w-3xl rounded-3xl shadow-xl shadow-slate-200/50 overflow-hidden flex flex-col border border-slate-100 relative">
            <div className="w-full bg-slate-100 h-2"><div className={`h-2 transition-all duration-500 ease-out bg-gradient-to-r ${theme.gradient}`} style={{ width: `${progress}%` }}></div></div>
            <div className="p-6 md:p-10 relative z-10">
               <div className="mb-8">
                 <div className="flex items-center gap-3 mb-4">
                    <span className={`bg-slate-100 ${theme.text} text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-slate-200`}>Question {currentIndex + 1}</span>
                    {isMulti && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full border border-amber-200">複選題</span>}
                 </div>
                 <h2 className="text-2xl font-bold text-slate-800 leading-snug" dangerouslySetInnerHTML={{ __html: currentQuestion.q }} />
               </div>
               <div className="mb-10 space-y-3">
                 {currentQuestion.o.map((opt, idx) => {
                   const isCorrect = currentQuestion.a.includes(idx);
                   const isSelected = selectedIndices.includes(idx);
                   let displayCorrect = false, displayWrong = false, displayMissed = false;
                   if (isSubmitted) {
                     if (isCorrect && isSelected) displayCorrect = true;
                     else if (!isCorrect && isSelected) displayWrong = true;
                     else if (isCorrect && !isSelected) displayMissed = true;
                   }
                   return <OptionButton key={idx} index={idx} text={opt} isSelected={isSelected} isSubmitted={isSubmitted} isCorrect={displayCorrect} isWrong={displayWrong} isMissed={displayMissed} theme={theme} onClick={() => handleOptionClick(idx)} />;
                 })}
               </div>
               <div>
                 {!isSubmitted ? (
                   <button onClick={handleSubmit} className={`w-full py-4 px-6 rounded-2xl ${theme.button} text-white font-bold text-lg ${theme.shadow} transition-all duration-200 transform hover:-translate-y-1 active:scale-[0.98]`}>送出答案</button>
                 ) : (
                   <button onClick={handleNext} className="w-full py-4 px-6 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-lg shadow-lg transition-all duration-200 transform hover:-translate-y-1 active:scale-[0.98]">{currentIndex === questions.length - 1 ? '查看成績' : '下一題'}</button>
                 )}
               </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeBank, setActiveBank] = useState(null);

      return (
        <div className="antialiased text-slate-900 min-h-screen bg-slate-50 font-sans">
          {activeBank ? (
            <QuizGame bank={activeBank} onExit={() => setActiveBank(null)} />
          ) : (
            <div className="min-h-screen bg-[#f8fafc] py-12 px-4 flex flex-col items-center justify-center overflow-hidden relative">
              <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
                 <div className="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-indigo-200/20 rounded-full blur-[100px]"></div>
                 <div className="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-cyan-200/20 rounded-full blur-[100px]"></div>
              </div>

              <div className="text-center mb-16 animate-fade-in-up relative z-10">
                <h1 className="text-5xl md:text-6xl font-black text-slate-900 tracking-tight mb-6">
                  考前衝刺<span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-500 animate-gradient-x">題庫系統</span>
                </h1>
                <p className="text-xl text-slate-500 max-w-2xl mx-auto font-medium leading-relaxed">
                  針對電腦網路與海運學科設計的專業模擬測驗。<br className="hidden md:block" />
                  請選擇下方題庫開始練習。
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl w-full px-4 relative z-10">
                {QUESTION_BANKS.map((bank, idx) => {
                   const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;
                   return (
                    <button
                      key={bank.id}
                      onClick={() => setActiveBank(bank)}
                      style={{ animationDelay: `${idx * 150}ms` }}
                      className={`group relative bg-white rounded-3xl p-8 md:p-10 shadow-xl hover:shadow-2xl shadow-slate-200/50 transition-all duration-300 transform hover:-translate-y-2 border border-slate-100 flex flex-col h-full overflow-hidden animate-fade-in-up text-left`}
                    >
                      <div className={`absolute top-0 right-0 w-64 h-64 bg-gradient-to-br ${theme.bgGradient} rounded-full -mr-20 -mt-20 transition-transform group-hover:scale-150 duration-700 ease-in-out opacity-50`}></div>
                      <div className={`relative z-10 w-20 h-20 bg-white rounded-2xl flex items-center justify-center mb-8 shadow-md group-hover:${theme.button} transition-all duration-300 border border-slate-50 group-hover:border-transparent group-hover:shadow-lg group-hover:shadow-${theme.text.split('-')[1]}-500/30`}>
                        {bank.icon === 'ship' ? (
                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={`w-10 h-10 ${theme.text} group-hover:text-white transition-colors`}>
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                          </svg>
                        ) : (
                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={`w-10 h-10 ${theme.text} group-hover:text-white transition-colors`}>
                            <path strokeLinecap="round" strokeLinejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 3.75V8.25m15 0h3m-3 3h3m-3 3h3" />
                          </svg>
                        )}
                      </div>
                      <div className="relative z-10">
                        <h2 className="text-2xl font-bold text-slate-800 mb-3 group-hover:text-slate-900 transition-colors">{bank.title}</h2>
                        <p className="text-slate-500 mb-6 leading-relaxed group-hover:text-slate-600">{bank.description}</p>
                        <div className={`inline-flex items-center text-sm font-bold ${theme.text} group-hover:underline decoration-2 underline-offset-4`}>
                          開始測驗 <span className="ml-2 group-hover:translate-x-1 transition-transform">→</span>
                        </div>
                      </div>
                    </button>
                   );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
