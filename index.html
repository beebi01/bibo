<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhen's Website</title>
  <style>
    /* 全局樣式 */
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F4F6F9;
      color: #333;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background-image: url('https://example.com/background-image.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* 頁首 */
    header {
      background-color: rgba(29, 161, 242, 0.9);
      color: white;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
      animation: fadeIn 2s ease-out;
    }

    header p {
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.8;
    }

    /* 動畫效果 */
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* 主要內容區 */
    main {
      margin-top: 20px;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 90%;
      margin-bottom: 40px;
      animation: slideUp 1s ease-out;
    }

    /* 往上滑動的動畫 */
    @keyframes slideUp {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 成員介紹區域 */
    .members-section {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .member {
      background-color: #f9f9f9;
      width: 250px;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .member:hover {
      transform: translateY(-10px);
    }

    .member img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .member h3 {
      font-size: 1.4rem;
      color: #1DA1F2;
      margin-top: 10px;
    }

    .member p {
      font-size: 1rem;
      color: #555;
      margin-top: 5px;
    }

    /* 音樂播放區 */
    .music-section {
      margin-top: 50px;
      text-align: center;
      width: 100%;
    }

    .music-section h2 {
      font-size: 2rem;
      color: #1DA1F2;
    }

    .audio-player {
      margin-top: 20px;
      width: 100%;
      max-width: 600px;
    }

    /* 聯絡表單 */
    .contact-section {
      margin-top: 50px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .contact-section h2 {
      font-size: 2rem;
      color: #1DA1F2;
    }

    .contact-section form {
      display: flex;
      flex-direction: column;
    }

    .contact-section input,
    .contact-section textarea {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .contact-section button {
      padding: 10px 20px;
      background-color: #1DA1F2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    .contact-section button:hover {
      background-color: #1A91D0;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
      .member {
        width: 45%;
      }

      .audio-player {
        width: 100%;
      }

      .contact-section {
        width: 90%;
      }
    }

    /* 超小螢幕優化 */
    @media (max-width: 480px) {
      .member {
        width: 90%;
      }

      .audio-player {
        width: 100%;
      }

      .contact-section {
        width: 100%;
      }
    }

  </style>
</head>

        </form>
      </section>
    </main>
  </div>

</body>
</html>
