                </button>
                <button onClick={onHome} className="w-full py-4 bg-white hover:bg-slate-50 text-slate-600 font-bold rounded-2xl border-2 border-slate-200 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 text-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                  回主選單
                </button>
              </div>
            </div>
          </div>

          {wrongList.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center gap-2 px-2">
                 <span className="w-1.5 h-6 bg-rose-500 rounded-full"></span>
                 <h3 className="text-lg font-bold text-slate-700">錯題檢討 ({wrongList.length})</h3>
              </div>
              {wrongList.map((item, idx) => (
                <div key={idx} className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
                  <div className="flex items-center mb-3 gap-2">
                     <span className="bg-slate-100 text-slate-500 text-xs font-bold px-2.5 py-1 rounded-md">Q{item.originalIndex + 1}</span>
                     {item.question.a.length > 1 && <span className="bg-amber-50 text-amber-600 text-xs font-bold px-2.5 py-1 rounded-md border border-amber-100">複選</span>}
                  </div>
                  <div className="text-slate-800 font-bold mb-4 leading-relaxed text-lg" dangerouslySetInnerHTML={{ __html: item.question.q }} />
                  
                  <div className="space-y-3">
                    <div className="bg-rose-50/50 rounded-xl p-3 border border-rose-100">
                      <span className="text-xs font-bold text-rose-500 uppercase tracking-wide block mb-2">你的回答</span>
                      <ul className="space-y-1">
                        {item.userSelected.length > 0 ? item.userSelected.map(selIdx => (
                          <li key={selIdx} className="flex items-start text-rose-800 text-base">
                            <span className="font-mono font-bold mr-2 w-4">{String.fromCharCode(65 + selIdx)}.</span>
                            {item.question.o[selIdx]}
                          </li>
                        )) : <li className="text-rose-400 italic text-sm">未作答</li>}
                      </ul>
                    </div>
                    <div className="bg-emerald-50/50 rounded-xl p-3 border border-emerald-100">
                      <span className="text-xs font-bold text-emerald-500 uppercase tracking-wide block mb-2">正確答案</span>
                       <ul className="space-y-1">
                        {item.question.a.map(ansIdx => (
                          <li key={ansIdx} className="flex items-start text-emerald-800 text-base">
                            <span className="font-mono font-bold mr-2 w-4">{String.fromCharCode(65 + ansIdx)}.</span>
                            {item.question.o[ansIdx]}
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const QuizGame = ({ bank, onExit }) => {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedIndices, setSelectedIndices] = useState([]);
      const [wrongList, setWrongList] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isQuizEnded, setIsQuizEnded] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [timeSpent, setTimeSpent] = useState(0);
      const timerRef = useRef(null);
      const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;

      useEffect(() => { startQuiz(); return () => stopTimer(); }, [bank]);

      const startTimer = () => {
        stopTimer();
        timerRef.current = setInterval(() => setTimeSpent(prev => prev + 1), 1000);
      };

      const stopTimer = () => { if (timerRef.current) clearInterval(timerRef.current); };

      const startQuiz = useCallback(() => {
        setIsLoading(true);
        // 若題庫數量少於設定的 limit，則使用實際題庫長度
        const safeLimit = Math.min(bank.limit, bank.questions.length);
        const shuffled = [...bank.questions].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, safeLimit);
        
        setQuestions(selected);
        setCurrentIndex(0);
        setScore(0);
        setWrongList([]);
        setSelectedIndices([]);
        setIsSubmitted(false);
        setIsQuizEnded(false);
        setTimeSpent(0);
        window.scrollTo(0, 0);
        setIsLoading(false);
        startTimer();
      }, [bank]);

      const currentQuestion = questions[currentIndex];
      
      if (isLoading || !currentQuestion) return (
        <div className={`min-h-screen flex items-center justify-center bg-gradient-to-br ${theme.bgGradient}`}>
           <div className="flex flex-col items-center gap-4">
              <div className={`animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-${theme.text.split('-')[1]}-600`}></div>
              <p className="text-slate-500 font-medium">準備試題中...</p>
           </div>
        </div>
      );

      const isMulti = currentQuestion.a.length > 1;
      const progress = ((currentIndex + 1) / questions.length) * 100;

      const handleOptionClick = (index) => {
        if (isSubmitted) return;
        if (isMulti) {
          if (selectedIndices.includes(index)) setSelectedIndices(selectedIndices.filter(i => i !== index));
          else setSelectedIndices([...selectedIndices, index]);
        } else {
          setSelectedIndices([index]);
        }
      };

      const handleSubmit = () => {
        if (selectedIndices.length === 0) { alert("請至少選擇一個答案！"); return; }
        setIsSubmitted(true);
        const sortedSelected = [...selectedIndices].sort((a, b) => a - b);
        const sortedCorrect = [...currentQuestion.a].sort((a, b) => a - b);
        const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
        if (isCorrect) setScore(prev => prev + 1);
        else setWrongList(prev => [...prev, { question: currentQuestion, userSelected: selectedIndices, originalIndex: currentIndex }]);
        
        // 平滑捲動到底部，確保手機上能看到下一題按鈕
        setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 100);
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedIndices([]);
          setIsSubmitted(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          stopTimer();
          setIsQuizEnded(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      if (isQuizEnded) return <div className={`min-h-screen bg-slate-50`}><ResultScreen score={score} total={questions.length} timeSpent={timeSpent} wrongList={wrongList} theme={theme} onRestart={startQuiz} onHome={onExit} /></div>;

      return (
        <div className={`min-h-screen bg-slate-50 pb-8 flex flex-col items-center animate-fade-in-up`}>
          {/* Header - 手機版置頂 */}
          <div className="sticky top-0 z-30 w-full bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-3 flex items-center justify-between">
             <button onClick={onExit} className="p-2 rounded-full hover:bg-slate-100 text-slate-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
             </button>
             <div className="flex flex-col items-center">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">{bank.title.split(' ')[0]}</span>
                <span className="text-sm font-black text-slate-800 tracking-tight">{formatTime(timeSpent)}</span>
             </div>
             <div className={`flex items-baseline gap-0.5 ${theme.text}`}>
                 <span className="text-xl font-black">{currentIndex + 1}</span>
                 <span className="text-xs font-medium opacity-60">/{questions.length}</span>
             </div>
          </div>

          {/* Progress Bar */}
          <div className="w-full h-1 bg-slate-200 sticky top-[60px] z-20">
             <div className={`h-full transition-all duration-500 ease-out bg-gradient-to-r ${theme.gradient}`} style={{ width: `${progress}%` }}></div>
          </div>

          {/* Main Content */}
          <div className="w-full max-w-2xl px-4 py-6 md:py-8 flex-grow">
             <div className="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 overflow-hidden relative border border-white">
                <div className="p-6 md:p-8">
                   <div className="mb-6">
                     <div className="flex items-center gap-2 mb-3">
                        {isMulti ? (
                            <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-md border border-amber-200">複選題</span>
                        ) : (
                            <span className="bg-slate-100 text-slate-500 text-xs font-bold px-2.5 py-1 rounded-md border border-slate-200">單選題</span>
                        )}
                     </div>
                     <h2 className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed tracking-tight" dangerouslySetInnerHTML={{ __html: currentQuestion.q }} />
                   </div>

                   <div className="space-y-3 mb-8">
                     {currentQuestion.o.map((opt, idx) => {
                       const isCorrect = currentQuestion.a.includes(idx);
                       const isSelected = selectedIndices.includes(idx);
                       let displayCorrect = false, displayWrong = false, displayMissed = false;
                       if (isSubmitted) {
                         if (isCorrect && isSelected) displayCorrect = true;
                         else if (!isCorrect && isSelected) displayWrong = true;
                         else if (isCorrect && !isSelected) displayMissed = true;
                       }
                       return <OptionButton key={idx} index={idx} text={opt} isSelected={isSelected} isSubmitted={isSubmitted} isCorrect={displayCorrect} isWrong={displayWrong} isMissed={displayMissed} theme={theme} onClick={() => handleOptionClick(idx)} />;
                     })}
                   </div>

                   <div className="pt-2">
                     {!isSubmitted ? (
                       <button onClick={handleSubmit} className={`w-full py-4 px-6 rounded-2xl ${theme.button} text-white font-bold text-lg shadow-lg ${theme.shadow} transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2`}>
                          送出答案
                       </button>
                     ) : (
                       <button onClick={handleNext} className="w-full py-4 px-6 rounded-2xl bg-slate-800 text-white font-bold text-lg shadow-lg transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2">
                          {currentIndex === questions.length - 1 ? '查看成績' : '下一題'}
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                       </button>
                     )}
                   </div>
                </div>
             </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeBank, setActiveBank] = useState(null);

      return (
        <div className="antialiased text-slate-900 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-700">
          {activeBank ? (
            <QuizGame bank={activeBank} onExit={() => setActiveBank(null)} />
          ) : (
            <div className="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4 py-12">
              {/* 動態背景 */}
              <div className="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob"></div>
              <div className="absolute top-0 -right-4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-2000"></div>
              <div className="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-4000"></div>

              <div className="relative z-10 w-full max-w-lg">
                <div className="text-center mb-12 animate-fade-in-up">
                  <div className="inline-block p-3 rounded-2xl bg-white/50 backdrop-blur-sm shadow-sm mb-4 border border-white">
                      <span className="text-sm font-bold text-slate-500 tracking-wider uppercase px-2">我好累</span>
                  </div>
                  <h1 className="text-4xl md:text-5xl font-black text-slate-900 tracking-tight mb-4 leading-tight">
                    考前衝刺<br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-indigo-600">題庫系統</span>
                  </h1>
                  <p className="text-slate-500 font-medium">請選擇您的考試科目</p>
                </div>

                <div className="grid gap-5 w-full">
                  {QUESTION_BANKS.map((bank, idx) => {
                     const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;
                     return (
                      <button
                        key={bank.id}
                        onClick={() => setActiveBank(bank)}
                        className={`group relative w-full bg-white/80 backdrop-blur-md rounded-[2rem] p-6 shadow-xl hover:shadow-2xl hover:shadow-${theme.text.split('-')[1]}-200 transition-all duration-300 transform hover:-translate-y-1 border border-white text-left overflow-hidden animate-fade-in-up flex items-center gap-5`}
                        style={{ animationDelay: `${idx * 150}ms` }}
                      >
                        <div className={`absolute right-0 top-0 w-32 h-32 bg-gradient-to-bl ${theme.bgGradient} opacity-50 rounded-bl-[100px] transition-all group-hover:scale-110`}></div>
                        
                        <div className={`relative z-10 w-16 h-16 rounded-2xl ${theme.bgGradient} flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform duration-300`}>
                           <span className="text-3xl">
                               {bank.icon === 'ship' ? '🚢' : '💻'}
                           </span>
                        </div>
                        
                        <div className="relative z-10 flex-1">
                          <h2 className="text-xl font-bold text-slate-800 mb-1 group-hover:text-black transition-colors">{bank.title}</h2>
                          <p className="text-slate-500 text-sm line-clamp-2 leading-relaxed">{bank.description}</p>
                        </div>
                        
                        <div className="relative z-10">
                            <div className={`w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:bg-slate-50 transition-colors`}>
                                <svg xmlns="http://www.w3.org/2000/svg" className={`h-5 w-5 ${theme.text}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" /></svg>
                            </div>
                        </div>
                      </button>
                     );
                  })}
                </div>
                
                <footer className="mt-12 text-center text-slate-400 text-sm font-medium">
                    ©可以讓我pass嗎 By要暴斃的人
                </footer>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
