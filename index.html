        description: '包含貨櫃運輸、貿易條件(Incoterms)、提單功能與海運實務基礎。',
        questions: BANK_2_DATA
      }
    ];

    // --- Components ---

    // 1. OptionButton
    const OptionButton = ({
      text,
      index,
      isSelected,
      isSubmitted,
      isCorrect,
      isMissed,
      isWrong,
      onClick,
    }) => {
      let baseClasses = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 mb-3 flex items-start group relative ";
      
      if (isSubmitted) {
        if (isCorrect) {
          baseClasses += "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium ";
        } else if (isWrong) {
          baseClasses += "border-rose-500 bg-rose-50 text-rose-800 ";
        } else if (isMissed) {
          baseClasses += "border-emerald-400 bg-white text-emerald-600 border-dashed ";
        } else {
          baseClasses += "border-slate-200 bg-slate-50 text-slate-400 opacity-70 ";
        }
      } else {
        if (isSelected) {
          baseClasses += "border-blue-500 bg-blue-50 text-blue-900 shadow-md ring-2 ring-blue-200/50 ";
        } else {
          baseClasses += "border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50 hover:shadow-sm text-slate-700 ";
        }
      }

      const letter = String.fromCharCode(65 + index);

      return (
        <button
          onClick={onClick}
          disabled={isSubmitted}
          className={baseClasses}
        >
          <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full mr-3 text-sm font-bold flex-shrink-0 transition-colors ${
            isSubmitted 
              ? (isCorrect || isMissed ? 'bg-emerald-200 text-emerald-800' : (isWrong ? 'bg-rose-200 text-rose-800' : 'bg-slate-200 text-slate-500'))
              : (isSelected ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-500 group-hover:bg-blue-100 group-hover:text-blue-600')
          }`}>
            {letter}
          </span>
          <span className="mt-1 leading-relaxed text-lg md:text-base break-words">{text}</span>
          
          {isSubmitted && (isCorrect || isMissed) && (
            <span className="absolute right-4 top-4 text-emerald-600">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-6 h-6">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </span>
          )}
          
          {isSubmitted && isWrong && (
            <span className="absolute right-4 top-4 text-rose-600">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-6 h-6">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </span>
          )}
        </button>
      );
    };

    // 2. ResultScreen
    const ResultScreen = ({ score, total, wrongList, onRestart, onHome }) => {
      const percentage = Math.round((score / total) * 100);
      
      let gradeColor = 'text-blue-600';
      let gradeText = 'Good Job!';
      if (percentage >= 90) { gradeColor = 'text-emerald-600'; gradeText = 'Excellent!'; }
      else if (percentage < 60) { gradeColor = 'text-rose-600'; gradeText = 'Keep Practicing'; }

      return (
        <div className="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden animate-fade-in-up mx-auto my-4 md:my-8">
          <div className="bg-slate-900 p-6 md:p-8 text-center text-white relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-indigo-600/30 to-purple-600/30"></div>
            <h2 className="text-2xl md:text-3xl font-bold mb-2 relative z-10">測驗結束</h2>
            <p className="text-slate-300 relative z-10 text-sm md:text-base">Your Performance Report</p>
          </div>

          <div className="p-6 md:p-8">
            <div className="flex flex-col items-center mb-8 md:mb-10">
              <div className="relative w-36 h-36 md:w-40 md:h-40 flex items-center justify-center mb-4">
                 <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                   <circle cx="50" cy="50" r="45" fill="none" stroke="#e2e8f0" strokeWidth="8" />
                   <circle 
                     cx="50" 
                     cy="50" 
                     r="45" 
                     fill="none" 
                     stroke="currentColor" 
                     strokeWidth="8" 
                     strokeDasharray={`${2 * Math.PI * 45}`} 
                     strokeDashoffset={`${2 * Math.PI * 45 * (1 - percentage / 100)}`} 
                     className={`${gradeColor} transition-all duration-1000 ease-out`}
                     strokeLinecap="round"
                   />
                 </svg>
                 <div className="absolute inset-0 flex flex-col items-center justify-center">
                    <span className={`text-3xl md:text-4xl font-bold ${gradeColor}`}>{score}</span>
                    <span className="text-sm text-slate-400 font-medium">/ {total}</span>
                 </div>
              </div>
              <div className={`text-2xl font-bold ${gradeColor}`}>{gradeText}</div>
              <p className="text-slate-500 mt-2">正確率: {percentage}%</p>
            </div>

            {wrongList.length > 0 && (
              <div className="mb-10">
                <h3 className="text-lg font-bold text-slate-800 mb-4 border-l-4 border-rose-500 pl-3">
                  錯題回顧 ({wrongList.length} 題)
                </h3>
                <div className="space-y-6">
                  {wrongList.map((item, idx) => (
                    <div key={idx} className="bg-slate-50 rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                      <div className="flex items-center mb-3">
                         <span className="bg-rose-100 text-rose-700 text-xs font-bold px-2 py-1 rounded mr-2">
                           第 {item.index + 1} 題
                         </span>
                         {item.question.a.length > 1 && (
                            <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded">複選</span>
                         )}
                      </div>
                      
                      <div 
                        className="text-slate-800 font-medium mb-4 leading-relaxed text-base"
                        dangerouslySetInnerHTML={{ __html: item.question.q }} 
                      />
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div className="bg-rose-50 border border-rose-100 rounded-lg p-3">
                          <span className="block text-rose-500 font-bold mb-1 text-xs uppercase tracking-wider">你的選擇</span>
                          <ul className="list-disc list-inside text-rose-900">
                            {item.userSelected.length > 0 ? (
                               item.userSelected.map(selIdx => (
                                 <li key={selIdx}>{String.fromCharCode(65 + selIdx)}. {item.question.o[selIdx]}</li>
                               ))
                            ) : (
                              <li className="italic text-rose-400">未作答</li>
                            )}
                          </ul>
                        </div>
                        
                        <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3">
                          <span className="block text-emerald-500 font-bold mb-1 text-xs uppercase tracking-wider">正確答案</span>
                           <ul className="list-disc list-inside text-emerald-900">
                            {item.question.a.map(ansIdx => (
                                 <li key={ansIdx}>{String.fromCharCode(65 + ansIdx)}. {item.question.o[ansIdx]}</li>
                               ))
                            }
                          </ul>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="flex flex-col gap-3">
              <button 
                onClick={onRestart}
                className="w-full py-4 bg-slate-900 hover:bg-blue-600 text-white font-bold rounded-xl shadow-lg transform hover:-translate-y-1 transition-all duration-200 flex items-center justify-center gap-2"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                重新測驗 (題目重洗)
              </button>
              
              <button 
                onClick={onHome}
                className="w-full py-4 bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl shadow-sm transition-all duration-200 flex items-center justify-center gap-2"
              >
                 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                返回題庫選單
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 3. Quiz Game Container
    const QuizGame = ({ bank, onExit }) => {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedIndices, setSelectedIndices] = useState([]);
      const [wrongList, setWrongList] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isQuizEnded, setIsQuizEnded] = useState(false);

      // Initialize Quiz
      useEffect(() => {
        startQuiz();
      }, [bank]); // Restart if bank changes

      const startQuiz = useCallback(() => {
        // Determine how many questions to show. 
        // If bank is small (like Bank 2), show all. If large (Bank 1), pick 40.
        const isLargeBank = bank.questions.length > 50;
        const limit = isLargeBank ? 40 : bank.questions.length;

        // Shuffle
        const shuffled = [...bank.questions].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, limit);
        
        setQuestions(selected);
        setCurrentIndex(0);
        setScore(0);
        setWrongList([]);
        setSelectedIndices([]);
        setIsSubmitted(false);
        setIsQuizEnded(false);
        window.scrollTo(0, 0);
      }, [bank]);

      const currentQuestion = questions[currentIndex];
      
      if (!currentQuestion) {
         return (
           <div className="min-h-screen flex items-center justify-center bg-slate-100">
             <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
           </div>
         );
      }

      const isMulti = currentQuestion.a.length > 1;

      const handleOptionClick = (index) => {
        if (isSubmitted) return;

        if (isMulti) {
          if (selectedIndices.includes(index)) {
            setSelectedIndices(selectedIndices.filter(i => i !== index));
          } else {
            setSelectedIndices([...selectedIndices, index]);
          }
        } else {
          setSelectedIndices([index]);
        }
      };

      const handleSubmit = () => {
        if (selectedIndices.length === 0) {
          alert("請至少選擇一個答案！");
          return;
        }

        setIsSubmitted(true);

        // Sort to compare arrays
        const sortedSelected = [...selectedIndices].sort((a, b) => a - b);
        const sortedCorrect = [...currentQuestion.a].sort((a, b) => a - b);
        const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);

        if (isCorrect) {
          setScore(prev => prev + 1);
        } else {
          // Record wrong answer
          setWrongList(prev => [
            ...prev, 
            {
              question: currentQuestion,
              userSelected: selectedIndices,
              index: currentIndex
            }
          ]);
        }
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedIndices([]);
          setIsSubmitted(false);
          window.scrollTo(0, 0);
        } else {
          setIsQuizEnded(true);
          window.scrollTo(0, 0);
        }
      };

      if (isQuizEnded) {
        return (
          <div className="min-h-screen bg-slate-100 py-8 px-4 flex justify-center">
            <ResultScreen 
              score={score} 
              total={questions.length} 
              wrongList={wrongList} 
              onRestart={startQuiz} 
              onHome={onExit}
            />
          </div>
        );
      }

      const progress = ((currentIndex + 1) / questions.length) * 100;

      return (
        <div className="min-h-screen bg-slate-100 py-6 px-4 flex flex-col items-center animate-fade-in-up">
          {/* Header / Brand */}
          <div className="mb-6 text-center">
            <h1 className="text-xl md:text-2xl font-bold text-slate-800 tracking-tight">{bank.title}</h1>
            <button onClick={onExit} className="text-slate-500 text-sm mt-1 hover:text-blue-600 underline">
              切換題庫
            </button>
          </div>

          {/* Main Card */}
          <div className="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden flex flex-col">
            {/* Progress Bar */}
            <div className="w-full bg-slate-100 h-2">
              <div 
                className="bg-blue-600 h-2 transition-all duration-500 ease-out" 
                style={{ width: `${progress}%` }}
              ></div>
            </div>

            {/* Top Info Bar */}
            <div className="flex justify-between items-center px-4 md:px-6 py-4 border-b border-slate-100 bg-slate-50/50">
              <div className="flex items-center gap-2">
                 <span className="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-md">
                   Q{currentIndex + 1}
                 </span>
                 <span className="text-slate-400 text-sm font-medium">/ {questions.length}</span>
              </div>
              <div className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                得分: {score}
              </div>
            </div>

            {/* Question Content */}
            <div className="p-4 md:p-8">
               <div className="mb-6">
                 {isMulti && (
                   <span className="inline-block bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded mb-2 align-middle mr-2 border border-amber-200">
                     複選
                   </span>
                 )}
                 <h2 
                   className="text-lg md:text-xl font-bold text-slate-800 leading-relaxed inline align-middle"
                   dangerouslySetInnerHTML={{ __html: currentQuestion.q }}
                 />
               </div>

               {/* Options List */}
               <div className="mb-8">
                 {currentQuestion.o.map((opt, idx) => {
                   const isCorrect = currentQuestion.a.includes(idx);
                   const isSelected = selectedIndices.includes(idx);
                   
                   let displayCorrect = false;
                   let displayWrong = false;
                   let displayMissed = false;

                   if (isSubmitted) {
                     if (isCorrect && isSelected) displayCorrect = true;
                     else if (!isCorrect && isSelected) displayWrong = true;
                     else if (isCorrect && !isSelected) displayMissed = true;
                   }

                   return (
                     <OptionButton
                        key={idx}
                        index={idx}
                        text={opt}
                        isSelected={isSelected}
                        isSubmitted={isSubmitted}
                        isCorrect={displayCorrect}
                        isWrong={displayWrong}
                        isMissed={displayMissed}
                        onClick={() => handleOptionClick(idx)}
                     />
                   );
                 })}
               </div>

               {/* Actions */}
               <div className="flex flex-col sm:flex-row gap-3">
                 {!isSubmitted ? (
                   <button 
                     onClick={handleSubmit}
                     className="w-full py-3.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold shadow-lg shadow-blue-500/30 transition-all duration-200 transform active:scale-[0.98]"
                   >
                     送出答案
                   </button>
                 ) : (
                   <button 
                     onClick={handleNext}
                     className="w-full py-3.5 px-6 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold shadow-lg transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2"
                   >
                     {currentIndex === questions.length - 1 ? '查看結果' : '下一題'}
                     <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                   </button>
                 )}
               </div>
            </div>
          </div>
        </div>
      );
    };


    // 4. Menu / Selection Screen
    const MenuScreen = ({ onSelectBank }) => {
      return (
        <div className="min-h-screen bg-slate-100 py-12 px-4 flex flex-col items-center justify-center animate-fade-in-up">
          <div className="text-center mb-10">
            <h1 className="text-3xl md:text-4xl font-bold text-slate-800 tracking-tight mb-2">
              題庫練習系統
            </h1>
            <p className="text-slate-500">請選擇要練習的章節範圍</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl w-full">
            {QUESTION_BANKS.map((bank) => (
              <button
                key={bank.id}
                onClick={() => onSelectBank(bank)}
                className="bg-white rounded-2xl p-8 shadow-xl hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-transparent hover:border-blue-200 group text-left flex flex-col h-full"
              >
                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-6 group-hover:bg-blue-600 transition-colors duration-300">
                   {bank.id === 'bank-2' ? (
                     <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-6 h-6 text-blue-600 group-hover:text-white">
                       <path strokeLinecap="round" strokeLinejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                     </svg>
                   ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-6 h-6 text-blue-600 group-hover:text-white">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                    </svg>
                   )}
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">
                  {bank.title}
                </h3>
                <p className="text-slate-500 text-sm leading-relaxed mb-6 flex-grow">
                  {bank.description}
                </p>
                <div className="flex items-center text-blue-600 font-bold text-sm">
                  開始測驗
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                  </svg>
                </div>
              </button>
            ))}
          </div>
          
          <div className="mt-12 text-center text-slate-400 text-xs">
            <p>&copy;Computer Exam Prep System. All rights reserved.</p>
          </div>
        </div>
      );
    };


    // 5. Main App Controller
    function App() {
      const [activeBank, setActiveBank] = useState(null);

      const handleSelectBank = (bank) => {
        setActiveBank(bank);
      };

      const handleExitQuiz = () => {
        setActiveBank(null);
      };

      return (
        <React.Fragment>
          {activeBank ? (
            <QuizGame bank={activeBank} onExit={handleExitQuiz} />
          ) : (
            <MenuScreen onSelectBank={handleSelectBank} />
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
