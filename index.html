<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考前衝刺題庫 (文字+圖片整合版)</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-container">
  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="header">
      <span id="progress"></span>
      <span id="score-now"></span>
    </div>

    <div id="question-area" class="question-text"></div>

    <ul id="options-area" class="options"></ul>

    <div class="controls">
      <button id="submit-btn" class="action-btn">送出答案</button>
      <button id="next-btn" class="action-btn">下一題</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen">
    <h2>測驗結束</h2>
    <p>你的總分</p>
    <div class="score-display">
      <span id="final-score">0</span> / <span id="total-score">0</span>
    </div>

    <button class="action-btn restart-btn">
      重新測驗 (題目重洗)
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
