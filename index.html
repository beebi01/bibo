<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhen's Webpage</title>
  <style>
    /* 基本樣式 */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: url('photos/bg7.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    header {
      background: #ffffff;  /* 明亮的背景顏色 */
      color: #333;
      text-align: center;
      padding: 40px 0;
      width: 100%;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 40px;
      border-radius: 8px;
    }

    h1 {
      font-size: 3em;
      margin: 0;
      color: #2f4f4f;
    }

    p {
      font-size: 1.2em;
      color: #4b4b4b;
      margin-top: 10px;
    }

    /* 內容區域 */
    main {
      background: #ffffff;  /* 明亮背景，沒有透明感 */
      padding: 40px;
      width: 100%;
      max-width: 900px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    .section-header {
      font-size: 2.2em;
      background-color: #F9A8D4;  /* 清新粉色背景 */
      padding: 15px 25px;
      margin-bottom: 25px;
      border-radius: 50px;
      display: inline-block;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #2f4f4f;
    }

    p.audio-description {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 20px;
    }

    .audio-player {
      margin-top: 20px;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
      header {
        padding: 20px 0;
      }

      h1 {
        font-size: 2.2em;
      }

      p {
        font-size: 1em;
      }

      main {
        padding: 20px;
      }

      h2 {
        font-size: 2em;
      }

      .section-header {
        font-size: 1.8em;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Hello!! Welcome to My Website</h1>
    <p>By Zhen Chen</p>
  </header>

  <main>
    <section>
      <div class="section-header">我的偶像</div>

      <h2>- Audio -</h2>
      <p class="audio-description">最喜歡的一首歌曲，讓我們一起聆聽！</p>

      <div class="audio-player">
        <audio controls autoplay muted>
          <source src="sample.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </div>
    </section>
  </main>

</body>
</html>
