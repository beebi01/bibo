                     <circle cx="50" cy="50" r={radius} fill="none" stroke="currentColor" strokeWidth="8" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} className={`${gradeColor} transition-all duration-1000 ease-out`} strokeLinecap="round" />
                   </svg>
                   <div className="absolute inset-0 flex flex-col items-center justify-center">
                      <span className={`text-4xl font-black ${gradeColor}`}>{score}</span>
                      <span className="text-xs text-slate-400 font-bold">/ {total}</span>
                   </div>
                </div>
                
                <div className="flex flex-col gap-3">
                   <div className="text-left">
                      <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider block">Time</span>
                      <div className="text-lg font-bold text-slate-700">{formatTime(timeSpent)}</div>
                   </div>
                   <div className="text-left">
                      <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider block">Rate</span>
                      <div className={`text-lg font-bold ${gradeColor}`}>{percentage}%</div>
                   </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <button onClick={onRestart} className={`py-3 ${theme.button} text-white font-bold rounded-xl shadow-md active:scale-95 transition-all text-sm flex items-center justify-center gap-1`}>
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                  再次挑戰
                </button>
                <button onClick={onHome} className="py-3 bg-slate-100 text-slate-600 font-bold rounded-xl active:scale-95 transition-all text-sm flex items-center justify-center gap-1">
                  回主選單
                </button>
              </div>
            </div>
          </div>

          {wrongList.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center gap-2 px-1">
                 <h3 className="text-base font-bold text-slate-700">錯題檢討 <span className="bg-rose-100 text-rose-600 text-xs px-2 py-0.5 rounded-full ml-1">{wrongList.length}</span></h3>
              </div>
              {wrongList.map((item, idx) => (
                <div key={idx} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
                  <div className="flex items-center mb-3 gap-2">
                     <span className="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-1 rounded">Q{item.originalIndex + 1}</span>
                     {item.question.a.length > 1 && <span className="bg-amber-50 text-amber-600 text-xs font-bold px-2 py-1 rounded border border-amber-100">複選</span>}
                  </div>
                  <div className="text-slate-800 font-bold mb-4 leading-relaxed text-lg" dangerouslySetInnerHTML={{ __html: item.question.q }} />
                  
                  <div className="space-y-2 mb-2">
                    <div className="bg-rose-50/50 rounded-xl p-3 border border-rose-100">
                      <span className="text-[10px] font-bold text-rose-500 uppercase block mb-1">你的回答</span>
                      {item.userSelected.length > 0 ? item.userSelected.map(selIdx => (
                        <div key={selIdx} className="flex items-start text-rose-800 text-base">
                          <span className="font-bold mr-1.5">{String.fromCharCode(65 + selIdx)}.</span>
                          {item.question.o[selIdx]}
                        </div>
                      )) : <span className="text-rose-400 text-base italic">未作答</span>}
                    </div>
                    <div className="bg-emerald-50/50 rounded-xl p-3 border border-emerald-100">
                      <span className="text-[10px] font-bold text-emerald-500 uppercase block mb-1">正確答案</span>
                       {item.question.a.map(ansIdx => (
                        <div key={ansIdx} className="flex items-start text-emerald-800 text-base">
                          <span className="font-bold mr-1.5">{String.fromCharCode(65 + ansIdx)}.</span>
                          {item.question.o[ansIdx]}
                        </div>
                      ))}
                    </div>
                  </div>
                  
                  <AIRobot question={item.question} userIndices={item.userSelected} />
                  
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const QuizGame = ({ bank, onExit }) => {
      const questions = useMemo(() => {
        const safeLimit = Math.min(bank.limit, bank.questions.length);
        const shuffled = shuffleArray(bank.questions);
        return shuffled.slice(0, safeLimit);
      }, [bank]);

      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedIndices, setSelectedIndices] = useState([]);
      const [wrongList, setWrongList] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isQuizEnded, setIsQuizEnded] = useState(false);
      const [timeSpent, setTimeSpent] = useState(0);
      
      const timerRef = useRef(null);
      const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;

      useEffect(() => {
        timerRef.current = setInterval(() => {
          setTimeSpent(prev => prev + 1);
        }, 1000);
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, []);

      const stopTimer = () => { if (timerRef.current) clearInterval(timerRef.current); };

      const currentQuestion = questions[currentIndex];
      const isMulti = currentQuestion ? currentQuestion.a.length > 1 : false;
      const progress = questions.length > 0 ? ((currentIndex + 1) / questions.length) * 100 : 0;

      const handleOptionClick = (index) => {
        if (isSubmitted) return;
        if (isMulti) {
          if (selectedIndices.includes(index)) setSelectedIndices(selectedIndices.filter(i => i !== index));
          else setSelectedIndices([...selectedIndices, index]);
        } else {
          setSelectedIndices([index]);
        }
      };

      const handleSubmit = () => {
        if (selectedIndices.length === 0) { alert("請至少選擇一個答案！"); return; }
        setIsSubmitted(true);
        const sortedSelected = [...selectedIndices].sort((a, b) => a - b);
        const sortedCorrect = [...currentQuestion.a].sort((a, b) => a - b);
        const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
        
        if (isCorrect) {
          setScore(prev => prev + 1);
        } else {
          setWrongList(prev => [...prev, { question: currentQuestion, userSelected: selectedIndices, originalIndex: currentIndex }]);
        }
        
        setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 100);
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedIndices([]);
          setIsSubmitted(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          stopTimer();
          setIsQuizEnded(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      if (!currentQuestion) return null;

      if (isQuizEnded) return (
        <div className={`min-h-screen bg-slate-50`}>
          <ResultScreen 
            score={score} 
            total={questions.length} 
            timeSpent={timeSpent} 
            wrongList={wrongList} 
            theme={theme} 
            onRestart={() => window.location.reload()} 
            onHome={onExit} 
          />
        </div>
      );

      return (
        <div className={`min-h-screen bg-slate-50 pb-20 flex flex-col items-center animate-fade-in-up`}>
          <div className="sticky top-0 z-30 w-full bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-3 flex items-center justify-between">
             <button onClick={onExit} className="p-2 rounded-full bg-slate-100 text-slate-500 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" /></svg>
             </button>
             <div className="flex flex-col items-center">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{bank.title.split(' ')[0]}</span>
                <span className="text-base font-black text-slate-800 tracking-tight leading-none">{formatTime(timeSpent)}</span>
             </div>
             <div className={`flex items-baseline gap-0.5 ${theme.text}`}>
                 <span className="text-xl font-black">{currentIndex + 1}</span>
                 <span className="text-xs font-bold opacity-60">/{questions.length}</span>
             </div>
          </div>

          <div className="w-full h-1 bg-slate-200 sticky top-[60px] z-20">
             <div className={`h-full transition-all duration-500 ease-out bg-gradient-to-r ${theme.gradient}`} style={{ width: `${progress}%` }}></div>
          </div>

          <div className="w-full max-w-xl px-4 py-6 flex-grow">
             <div className="bg-white rounded-3xl shadow-lg shadow-slate-200/50 overflow-hidden relative border border-white">
                <div className="p-5">
                   <div className="mb-6">
                     <div className="flex items-center gap-2 mb-3">
                        {isMulti ? (
                            <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-0.5 rounded border border-amber-200">複選題</span>
                        ) : (
                            <span className="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-0.5 rounded border border-slate-200">單選題</span>
                        )}
                     </div>
                     <h2 className="text-lg md:text-xl font-bold text-slate-800 leading-snug tracking-tight" dangerouslySetInnerHTML={{ __html: currentQuestion.q }} />
                   </div>

                   <div className="space-y-3 mb-6">
                     {currentQuestion.o.map((opt, idx) => {
                       const isCorrect = currentQuestion.a.includes(idx);
                       const isSelected = selectedIndices.includes(idx);
                       let displayCorrect = false, displayWrong = false, displayMissed = false;
                       if (isSubmitted) {
                         if (isCorrect && isSelected) displayCorrect = true;
                         else if (!isCorrect && isSelected) displayWrong = true;
                         else if (isCorrect && !isSelected) displayMissed = true;
                       }
                       return <OptionButton key={idx} index={idx} text={opt} isSelected={isSelected} isSubmitted={isSubmitted} isCorrect={displayCorrect} isWrong={displayWrong} isMissed={displayMissed} theme={theme} onClick={() => handleOptionClick(idx)} />;
                     })}
                   </div>

                   <div className="pt-2">
                     {!isSubmitted ? (
                       <button onClick={handleSubmit} className={`w-full py-4 px-6 rounded-xl ${theme.button} text-white font-bold text-lg shadow-md transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2`}>
                          送出答案
                       </button>
                     ) : (
                       <button onClick={handleNext} className="w-full py-4 px-6 rounded-xl bg-slate-800 text-white font-bold text-lg shadow-md transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2">
                          {currentIndex === questions.length - 1 ? '查看成績' : '下一題'}
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                       </button>
                     )}
                   </div>
                </div>
             </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeBank, setActiveBank] = useState(null);

      return (
        <div className="antialiased text-slate-900 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-700">
          {activeBank ? (
            <QuizGame bank={activeBank} onExit={() => setActiveBank(null)} />
          ) : (
            <div className="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-5 py-12">
              <div className="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob"></div>
              <div className="absolute top-0 -right-4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-2000"></div>
              <div className="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-4000"></div>

              <div className="relative z-10 w-full max-w-md">
                <div className="text-center mb-10 animate-fade-in-up">
                  <div className="inline-block p-2 rounded-xl bg-white/60 backdrop-blur-sm shadow-sm mb-3 border border-white">
                      <span className="text-xs font-bold text-slate-500 tracking-wider uppercase px-2">Exam Prep</span>
                  </div>
                  <h1 className="text-3xl font-black text-slate-900 tracking-tight mb-3 leading-tight">
                    考前衝刺<br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-indigo-600">題庫系統</span>
                  </h1>
                  <p className="text-slate-500 font-medium text-sm">請選擇您的考試科目</p>
                </div>

                <div className="grid gap-4 w-full">
                  {QUESTION_BANKS.map((bank, idx) => {
                     const theme = bank.icon === 'ship' ? THEMES.ship : THEMES.computer;
                     return (
                      <button
                        key={bank.id}
                        onClick={() => setActiveBank(bank)}
                        className={`group relative w-full bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 border border-white text-left overflow-hidden animate-fade-in-up flex items-center gap-5`}
                        style={{ animationDelay: `${idx * 100}ms` }}
                      >
                        <div className={`absolute right-0 top-0 w-24 h-24 bg-gradient-to-bl ${theme.bgGradient} opacity-50 rounded-bl-[80px] transition-all group-hover:scale-110`}></div>
                        
                        <div className={`relative z-10 w-14 h-14 rounded-2xl ${theme.bgGradient} flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform duration-300 shrink-0`}>
                           <span className="text-3xl">
                               {bank.icon === 'ship' ? '🚢' : '💻'}
                           </span>
                        </div>
                        
                        <div className="relative z-10 flex-1 min-w-0">
                          <h2 className="text-lg font-bold text-slate-800 mb-1 group-hover:text-black transition-colors">{bank.title}</h2>
                          <p className="text-slate-500 text-xs leading-relaxed truncate">{bank.description}</p>
                        </div>
                        
                        <div className="relative z-10">
                            <div className={`w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:bg-slate-50 transition-colors`}>
                                <svg xmlns="http://www.w3.org/2000/svg" className={`h-5 w-5 ${theme.text}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" /></svg>
                            </div>
                        </div>
                      </button>
                     );
                  })}
                </div>
                
                <footer className="mt-12 text-center text-slate-400 text-xs font-medium">
                    ©可以讓我pass嗎 By要暴斃的人
                </footer>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
